name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List uploaded files
        run: |
          echo "Current directory contents:"
          ls -la
          pwd

      - name: Extract ZIP files
        run: |
          if [ -f "XiaomiToolkit-Upload.zip" ]; then
            echo "Found XiaomiToolkit-Upload.zip, extracting..."
            unzip -o XiaomiToolkit-Upload.zip
            ls -la
            
            if [ -f "XiaomiToolkit-Upload/XiaomiToolkit.zip" ]; then
              echo "Extracting inner ZIP..."
              cd XiaomiToolkit-Upload
              unzip -o XiaomiToolkit.zip
              cd ..
              
              if [ -d "XiaomiToolkit-Upload/XiaomiToolkit" ]; then
                echo "Moving project files to root..."
                cp -r XiaomiToolkit-Upload/XiaomiToolkit/* .
                ls -la
              fi
            fi
          elif [ -f "XiaomiToolkit.zip" ]; then
            echo "Found XiaomiToolkit.zip directly, extracting..."
            unzip -o XiaomiToolkit.zip
            if [ -d "XiaomiToolkit" ]; then
              cp -r XiaomiToolkit/* .
            fi
          else
            echo "No ZIP file found, checking if files already extracted..."
            if [ ! -f "gradlew" ]; then
              echo "ERROR: No gradlew found!"
              exit 1
            fi
          fi
          
          echo "Final structure:"
          ls -la
          
          if [ -f "build.gradle.kts" ]; then
            echo "✓ Found build.gradle.kts"
          else
            echo "✗ build.gradle.kts not found!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✓ gradlew is now executable"
          else
            echo "✗ gradlew not found!"
            exit 1
          fi

      - name: Validate Gradle wrapper
        run: |
          ./gradlew --version

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK  
        run: |
          ./gradlew assembleRelease --stacktrace --info

      - name: List APK files
        run: |
          echo "Looking for APK files..."
          find . -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: app-release  
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
