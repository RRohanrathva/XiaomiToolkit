name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          echo "=== Extracting ZIP files ==="
          
          if [ -f "XiaomiToolkit-Final.zip" ]; then
            echo "Found XiaomiToolkit-Final.zip"
            unzip -q XiaomiToolkit-Final.zip
            
            if [ -d "XiaomiToolkit-Upload" ] && [ -f "XiaomiToolkit-Upload/XiaomiToolkit.zip" ]; then
              echo "Extracting inner ZIP..."
              cd XiaomiToolkit-Upload
              unzip -q XiaomiToolkit.zip
              cd ..
              
              if [ -d "XiaomiToolkit-Upload/XiaomiToolkit" ]; then
                echo "Moving files to root..."
                cp -r XiaomiToolkit-Upload/XiaomiToolkit/* .
              fi
            fi
          fi
          
          echo "=== Final structure ==="
          ls -la
          
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✓ APK found!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "✗ APK not found!"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: XiaomiToolkit-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release APK (optional)
        continue-on-error: true
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: XiaomiToolkit-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
