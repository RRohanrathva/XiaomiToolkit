name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          echo "=== Extracting ZIP ==="
          
          # Try to find and extract ZIP
          if [ -f "XiaomiToolkit-Upload.zip" ]; then
            unzip -q XiaomiToolkit-Upload.zip
            cd XiaomiToolkit-Upload
            unzip -q XiaomiToolkit.zip
            mv XiaomiToolkit/* ../
            cd ..
          elif [ -f "XiaomiToolkit.zip" ]; then
            unzip -q XiaomiToolkit.zip
            mv XiaomiToolkit/* .
          fi
          
          echo "=== Files after extraction ==="
          ls -la
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Make gradlew executable  
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
