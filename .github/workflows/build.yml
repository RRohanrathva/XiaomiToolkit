name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip file found in the repo"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          SETTINGS=$(find /tmp/proj -maxdepth 3 -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found inside the zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiTool-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
