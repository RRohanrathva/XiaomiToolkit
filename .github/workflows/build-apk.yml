name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (works with plain files OR an un-extracted .zip)
        id: find
        shell: bash
        run: |
          set -e
          if [ ! -f gradlew ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No gradlew and no .zip found in the repository"; exit 1
            fi
            echo "Extracting $ZIP"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            GRADLEW=$(find "$RUNNER_TEMP/src" -name gradlew -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$GRADLEW" ]; then
              echo "::error::gradlew not found inside the zip"; exit 1
            fi
            DIR=$(dirname "$GRADLEW")
          else
            DIR="$GITHUB_WORKSPACE"
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/debug/*.apk   "$GITHUB_WORKSPACE/apk-out/XiaomiToolkit-debug.apk"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/apk-out/XiaomiToolkit-release.apk"
          ls -la "$GITHUB_WORKSPACE/apk-out"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiToolkit-APK
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
